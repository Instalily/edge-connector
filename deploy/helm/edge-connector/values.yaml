# The connector only dials out: to the hub on TCP 443 (directly or through
# your proxy), and to the targets in `allow`. It accepts no inbound
# connections and has no Service.

image:
  # Required. The ECR Public repository and a release tag from Instalily.
  # Prefer a digest ("sha256:...") in tag, verified with cosign; see the
  # repository's README.
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Two replicas keep the tunnel up through node drains and upgrades.
replicaCount: 2

hub:
  # Required. Instalily provides your hub's address.
  address: ""
  # The name verified on the hub's certificate; defaults to address's host.
  serverName: ""
  # Tunnels per replica.
  connections: 2
  # Roughly how long a tunnel lasts before the connector replaces it, opening
  # the new one first. Empty uses the connector's default, 5m. Rotation
  # moves tunnels onto renewed certificates, and onto new hub instances
  # while Instalily updates the hub, without a gap in access.
  rotateAfter: ""

# How the connector gets its certificate.
#
# Enrollment (the default): create a Secret holding the token Instalily sends
# you, under the key "token", and name it here. Each replica generates its own
# key, enrolls once, keeps its certificate on its own small volume, and renews
# it automatically. The token is only needed until every replica has
# enrolled, and expires within a week. Adding replicas later needs a fresh
# token.
enrollment:
  tokenSecret: ""
  storage:
    size: 64Mi
    # Empty uses the cluster's default StorageClass, the one `kubectl get
    # storageclass` marks "(default)". If none is marked, name one here before
    # the first install: without it the claims and pods stay Pending, and a
    # StatefulSet's claims can't be changed by an upgrade (see the README).
    storageClassName: ""

# Certificates issued by hand, instead of enrollment: a Secret holding ca.crt
# (the hub CA) and tls.crt/tls.key (this connector's certificate). Setting it
# deploys a Deployment instead of a StatefulSet.
tls:
  existingSecret: ""

# An http:// or https:// proxy for reaching the hub, e.g.
# http://user:pass@proxy.corp.local:3128. Empty uses no proxy.
proxy: ""

# Required. The only targets Instalily can reach. Instalily cannot change
# this list; only you can, by changing these values. Each entry is a `host`
# (exact, or "*.suffix") or a `cidr` (a bare IP means one address), with its
# ports. See the README for how names and addresses are matched.
allow: []
#  - host: sap-prd.corp.local
#    ports: [3300]
#  - cidr: 10.20.0.0/16
#    ports: [5432]

limits:
  maxStreams: 256
  dialTimeout: 10s

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}

# Restrict the connector's egress with a NetworkPolicy. NetworkPolicies
# match addresses, not names, so list the hub's and the targets' CIDRs. For
# a target behind a Kubernetes Service, list its ClusterIP as well as its
# pods: some network plugins (the AWS VPC CNI among them) match the address
# before the Service translates it. DNS (port 53) is always allowed, to any
# address.
networkPolicy:
  enabled: false
  egress: []
  #  - cidr: 203.0.113.10/32   # the hub, or your proxy
  #    ports: [443]
  #  - cidr: 10.20.0.0/16
  #    ports: [5432]
