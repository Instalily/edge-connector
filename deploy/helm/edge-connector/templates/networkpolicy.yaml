{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "edge-connector.fullname" . }}
  labels:
    {{- include "edge-connector.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "edge-connector.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  # No ingress rules: nothing may connect to the connector. Kubelet probes
  # come from the node, which most network plugins always allow.
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- range .Values.networkPolicy.egress }}
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
      ports:
        {{- range .ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
{{- end }}
