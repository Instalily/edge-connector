{{- if not (include "edge-connector.enrolls" .) }}
# Certificates issued by hand: replicas share them, so a Deployment will do.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edge-connector.fullname" . }}
  labels:
    {{- include "edge-connector.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "edge-connector.selectorLabels" . | nindent 6 }}
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    {{- include "edge-connector.podTemplate" . | nindent 4 }}
{{- end }}
