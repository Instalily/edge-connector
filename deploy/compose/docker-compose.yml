# The edge connector for hosts without Kubernetes.
#
# 1. Save the token Instalily sends you as ./token. The container runs as UID
#    65532, which must be able to read it.
# 2. Copy config.example.yaml to config.yaml and fill in the hub address and
#    your allowlist.
# 3. docker compose run --rm connector -config /etc/edge-connector/config.yaml -check
#    to see the allowlist the connector will enforce, then:
#    docker compose up -d
#
# The connector enrolls once and keeps its key and certificate in the "state"
# volume; after it logs "enrolled", empty ./token (": > token"). Don't delete
# it: Docker would create a directory in its place. Keep the volume: without
# it the connector needs a fresh token.
#
# With certificates issued by hand instead, put ca.crt, tls.crt and tls.key in
# ./tls, use the tls section in config.yaml, and swap the token and state
# mounts below for "./tls:/etc/edge-connector/tls:ro".
services:
  connector:
    image: ${EDGE_CONNECTOR_IMAGE:?set EDGE_CONNECTOR_IMAGE to the image Instalily provides}
    command: ["-config", "/etc/edge-connector/config.yaml"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      # Set if outbound traffic must go through a proxy.
      HTTPS_PROXY: ${HTTPS_PROXY:-}
    volumes:
      - ./config.yaml:/etc/edge-connector/config.yaml:ro
      - ./token:/etc/edge-connector/token:ro
      - state:/var/lib/edge-connector
    healthcheck:
      # Healthy while at least one tunnel to the hub is open.
      test: ["CMD", "/usr/local/bin/edge-connector", "-probe", "http://127.0.0.1:8080/readyz"]
      interval: 30s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

volumes:
  state: {}
