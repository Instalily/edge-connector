name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs all of CI on the tagged commit before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt on: $unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only GitHub-owned actions are allowed here, so Helm runs from its image.
      - name: Lint and render
        run: |
          helm() { docker run --rm -v "$PWD/deploy/helm:/charts:ro" alpine/helm:3.16.4 "$@"; }
          # Enrollment (StatefulSet) and certificates issued by hand (Deployment).
          for values in deploy/helm/edge-connector/ci/*-values.yaml; do
            values=/charts/edge-connector/ci/$(basename "$values")
            helm lint --strict /charts/edge-connector -f "$values"
            helm template ci /charts/edge-connector -f "$values" >/dev/null
          done
          if helm template ci /charts/edge-connector >/dev/null 2>&1; then
            echo "::error::The chart rendered without its required values"
            exit 1
          fi

  opentofu:
    name: OpenTofu modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only GitHub-owned actions are allowed here, so OpenTofu runs from its image.
      - name: Format, validate and test
        run: |
          for module in deploy/opentofu/*/; do
            echo "::group::$module"
            docker run --rm -v "$PWD/$module:/m" -w /m --entrypoint sh \
              ghcr.io/opentofu/opentofu:1.11.5 -c \
              'tofu fmt -check -recursive . && tofu init -backend=false -input=false && tofu validate && tofu test'
            echo "::endgroup::"
          done

  e2e:
    name: Containers end to end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run
        run: test/e2e/run.sh

  azure:
    name: Azure template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bicep lint, and each azuredeploy.json matches its azuredeploy.bicep
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bicep" https://github.com/Azure/bicep/releases/download/v0.31.92/bicep-linux-x64
          echo "4ba96f90e767fc606f23bbbf60cf07ef3557665cc70b893172193edd86685815  $RUNNER_TEMP/bicep" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bicep"
          for dir in deploy/azure deploy/azure-container-apps; do
            "$RUNNER_TEMP/bicep" lint "$dir/azuredeploy.bicep"
            "$RUNNER_TEMP/bicep" build "$dir/azuredeploy.bicep" --stdout > "$RUNNER_TEMP/azuredeploy.json"
            if ! diff -u "$dir/azuredeploy.json" "$RUNNER_TEMP/azuredeploy.json"; then
              echo "::error::$dir/azuredeploy.json is stale: rebuild it from azuredeploy.bicep (see $dir/README.md)"
              exit 1
            fi
          done

      - name: cloud-init schema
        run: |
          config='{"hub":{"address":"203.0.113.10:443","connections":2},"state_dir":"/var/lib/edge-connector","enrollment":{"token_file":"/etc/edge-connector/token"},"allow":[{"cidr":"10.1.2.3","ports":[1433]}],"health_listen":"127.0.0.1:8080"}'
          sed -e 's#@@IMAGE@@#public.ecr.aws/example/edge-connector@sha256:0000#' \
              -e "s#@@CONFIG@@#$config#" -e 's#@@TOKEN@@#example-token#' \
            deploy/azure/cloud-init.yaml > "$RUNNER_TEMP/cloud-init.yaml"
          if grep -nE '@@[A-Z]+@@' "$RUNNER_TEMP/cloud-init.yaml"; then
            echo "::error::cloud-init.yaml has a placeholder the template doesn't fill"
            exit 1
          fi
          docker run --rm -v "$RUNNER_TEMP/cloud-init.yaml:/c.yaml:ro" ubuntu:24.04 sh -c \
            'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cloud-init >/dev/null && cloud-init schema -c /c.yaml'

  # Biome and Gitleaks: the organization requires both on every repository
  # through workflows in Instalily/standard, which is internal, and GitHub
  # doesn't run an internal repository's workflows for a public one. They run
  # here instead, at the same versions, and edge-connector is excluded from the
  # organization rulesets. Only GitHub-owned actions are allowed here, so each
  # downloads its pinned release and checks it.
  biome:
    name: Biome
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BIOME_VERSION: "2.5.1"
      BIOME_SHA256: beb442e5c9bea7f52ae6d6eb6ae4819388a8b590492d6706b9dfffca8088f066
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Biome
        run: |
          curl -sSfL -o "$RUNNER_TEMP/biome" \
            "https://github.com/biomejs/biome/releases/download/@biomejs/biome@${BIOME_VERSION}/biome-linux-x64"
          echo "${BIOME_SHA256}  $RUNNER_TEMP/biome" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/biome"

      # Read-only: formats and lints per biome.json, and never writes.
      - name: Check
        run: '"$RUNNER_TEMP/biome" ci .'

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.24.3"
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      # A pull request's own commits, as the organization workflow scans them;
      # a push to main or a release scans the whole history.
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            set -- --log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}"
          fi
          "$RUNNER_TEMP/gitleaks" detect --redact -v --exit-code=2 "$@"
