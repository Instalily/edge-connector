name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt on: $unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only GitHub-owned actions are allowed here, so Helm runs from its image.
      - name: Lint and render
        run: |
          helm() { docker run --rm -v "$PWD/deploy/helm:/charts:ro" alpine/helm:3.16.4 "$@"; }
          helm lint --strict /charts/edge-connector -f /charts/edge-connector/ci/test-values.yaml
          helm template ci /charts/edge-connector -f /charts/edge-connector/ci/test-values.yaml >/dev/null
          if helm template ci /charts/edge-connector >/dev/null 2>&1; then
            echo "::error::The chart rendered without its required values"
            exit 1
          fi

  e2e:
    name: Containers end to end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run
        run: test/e2e/run.sh
