# Publishes a release when a cloud-admin pushes a vX.Y.Z tag on a main commit:
#
# - multi-arch (linux/amd64, linux/arm64) connector and hub images on ECR
#   Public, with SBOM and provenance attestations;
# - a cosign keyless signature on each image digest;
# - a GitHub release with static binaries and their SHA-256 sums, for hosts
#   that run the connector without containers.
#
# Only cloud-admins can create v* tags, and only a v* tag can run in the
# release environment, whose identity alone may push these images (infra:
# github/edge-connector.tf and edge-connector-public-ecr.tf). ECR Public has no
# immutable tags, so this workflow refuses to overwrite one.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # the GitHub release
      id-token: write # AWS role and cosign keyless signing
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the tag is a version on main
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$VERSION is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          # The full-history checkout above already has origin/main.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$VERSION does not point at a commit on main"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Find the repositories and refuse to overwrite a tag
        run: |
          for name in edge-connector edge-hub; do
            uri=$(aws ecr-public describe-repositories --repository-names "$name" \
              --query 'repositories[0].repositoryUri' --output text)
            if aws ecr-public describe-images --repository-name "$name" \
                --image-ids imageTag="$VERSION" >/dev/null 2>&1; then
              echo "::error::$uri:$VERSION already exists"
              exit 1
            fi
            echo "$(echo "$name" | tr a-z- A-Z_)_REPOSITORY=$uri" >> "$GITHUB_ENV"
          done
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws

      - name: Build and push the images
        run: |
          docker buildx create --use --driver docker-container >/dev/null
          for target in connector hub; do
            case $target in
              connector) repository=$EDGE_CONNECTOR_REPOSITORY ;;
              hub) repository=$EDGE_HUB_REPOSITORY ;;
            esac
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --target "$target" \
              --build-arg VERSION="$VERSION" \
              --sbom=true \
              --provenance=mode=max \
              --tag "$repository:$VERSION" \
              --metadata-file "/tmp/$target.json" \
              --push .
            digest=$(jq -r '."containerimage.digest"' "/tmp/$target.json")
            echo "${target^^}_IMAGE=$repository@$digest" >> "$GITHUB_ENV"
          done

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the images
        run: |
          cosign sign --yes "$CONNECTOR_IMAGE"
          cosign sign --yes "$HUB_IMAGE"

      - name: Build the binaries
        run: |
          mkdir dist
          for platform in linux/amd64 linux/arm64 windows/amd64; do
            os=${platform%/*} arch=${platform#*/}
            ext=""
            if [ "$os" = windows ]; then ext=.exe; fi
            # Each binary is named as the README and images name it.
            for binary in edge-connector:connector edgectl:edgectl; do
              name=${binary%%:*} cmd=${binary#*:}
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X main.version=$VERSION" \
                -o "dist/$name-$VERSION-$os-$arch$ext" "./cmd/$cmd"
            done
          done
          (cd dist && sha256sum -- * > SHA256SUMS)

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          cat > notes.md <<EOF
          ## Images

          | Image | Pinned reference |
          |---|---|
          | Connector | \`$CONNECTOR_IMAGE\` |
          | Hub | \`$HUB_IMAGE\` |

          Both are built for linux/amd64 and linux/arm64. Deploy by digest, and verify the signature first:

          \`\`\`bash
          cosign verify \\
            --certificate-identity '$identity' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            '$CONNECTOR_IMAGE'
          \`\`\`

          ## Binaries

          For hosts that run the connector without containers. Check them against \`SHA256SUMS\`.
          EOF
          gh release create "$VERSION" dist/* --verify-tag --title "$VERSION" --notes-file notes.md
