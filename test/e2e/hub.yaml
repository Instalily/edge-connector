tunnel:
  listen: ":8443"
  tls:
    ca_file: /pki/connector-ca.crt
    cert_file: /pki/hub.crt
    key_file: /pki/hub.key
  allowed_identities: [connector-1]
enrollment:
  ca_key_file: /pki/connector-ca.key
  hub_ca_file: /pki/hub-ca.crt
  token_keys_file: /pki/token.pub
endpoints:
  - name: postgres
    listen: ":5432"
    target: postgres:5432
  # Not on the connector's allowlist.
  - name: postgres-other-port
    listen: ":5433"
    target: postgres:5433
health_listen: ":8080"
# Compose stops containers after 10s; drain briefly so the test stays quick.
shutdown_grace: 1s
